<!doctype html>
<html lang="en-GB">
<head>
  <title>movable (lit-movable)</title>
  <meta charset="utf-8">
  <style>
    html, body {
      background: #fafafa;
      height: 100%;
      font-family: Arial, sans-serif;
      font-size: 18px;
    }
    div {
      position: relative;
      padding: 8px;
    }
  </style>
  <script type="module" src="./src/Movable.js"></script>
</head>
<body>
<div style="display: flex; height: 250px">
  <div style="width: 33%">
    <movable-el>
      <div style="background: lightsteelblue">move me anywhere</div>
    </movable-el>
  </div>
  <div style="width: 33%">
    <movable-el axis="x" boundsX="-50,250">
      <div style="background: lightsteelblue">Move me horizontally</div>
    </movable-el>
  </div>
  <div style="width: 33%">
    <div style="height: 200px; width: 200px; border: solid 1px blue;" id="dialog">
      <movable-el targetSelector="#dialog">
        <div slot="handle" style="background: lightsteelblue; width: 186px">
          I am a draggable title
        </div>
      </movable-el>
      Body text is not a handle — drag the title.
    </div>
  </div>
</div>
<div style="display: flex; height: 50%">
  <div style="width: 33%">
    <movable-el grid="50" shiftBehavior>
      <div style="background: lightsteelblue">
        my grid is 50<br>(try holding shift while dragging)
      </div>
    </movable-el>
  </div>
  <div style="width: 33%">
    <movable-el axis="y" boundsY="-999,9999">
      <div style="background: lightsteelblue">Move me vertically</div>
    </movable-el>
  </div>
  <div style="width: 33%">
    <div style="height: 200px; width: 200px; border: solid 1px green; position: relative">
      <movable-el posTop="100" posLeft="100" boundsX="-100,100" boundsY="-100,100">
        <div
          style="background: lightsteelblue; width: 30px; margin-left: -15px; height: 18px; margin-top: -9px"
        >
          box
        </div>
      </movable-el>
    </div>
  </div>
</div>
</body>
</html>
